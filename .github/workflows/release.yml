name: release
# Runs on a vX.Y.Z tag: lints and tests the package, writes the tag's version into
# src/costfluent/_version.py, builds the sdist and wheel, and publishes them to PyPI with
# attestations.
#
# PyPI authenticates the publish job by trusted publishing (OIDC): the project's trusted publisher
# on pypi.org names this repository and release.yml, and no token is stored here. Only that job
# holds the OIDC token; the build job, which installs packages and runs code, never does.
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No dependency cache: a tag run would restore what another ref wrote into a release.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install development requirements
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -t .
      - name: Set version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          printf '__version__ = "%s"\n' "${TAG#v}" > src/costfluent/_version.py
      - name: Build
        run: hatchling build
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token PyPI exchanges for a short-lived upload credential and signs attestations with.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
